name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 18
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'
          cache: maven

      - name: Compile project
        run: |
          export PATH="$GITHUB_WORKSPACE/global_bin:$GITHUB_WORKSPACE/src/main/bin:$GITHUB_WORKSPACE/src/test/script:$PATH"
          mvn -Dmaven.repo.local=.m2/repository clean compile

  java-test:
    runs-on: ubuntu-latest
    needs: java-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 18
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'
          cache: maven

      - name: Run tests
        run: |
          export PATH="$GITHUB_WORKSPACE/global_bin:$GITHUB_WORKSPACE/src/main/bin:$GITHUB_WORKSPACE/src/test/script:$PATH"
          mvn -Dmaven.repo.local=.m2/repository test

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/online_doc/package-lock.json

      - name: Install dependencies
        working-directory: docs/online_doc
        run: npm ci

      - name: Build documentation
        working-directory: docs/online_doc
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/online_doc/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [java-test, docs-build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
